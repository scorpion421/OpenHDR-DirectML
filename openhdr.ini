; ==============================================================================
; OpenHDR-DirectML Configuration File
; ==============================================================================
; Location: <Player Directory>\openhdr.ini  (e.g. next to mpc-be64.exe)
;      or:  <Player Directory>\OpenHDR\openhdr.ini
; Changes take effect automatically on the next video playback start.
; ==============================================================================

[General]
; Master toggle for the OpenHDR DirectML conversion pipeline
enabled = true

; Only process SDR video (automatically bypasses native HDR10, HLG, and BT.2020)
sdr_only = true

; Resolution Gate: Maximum source resolution to process.
; Content exceeding these limits (e.g. 1440p or 4K UHD) is bypassed with 0% overhead.
max_width = 1920
max_height = 1088


[HDR_Engine]
; ------------------------------------------------------------------------------
; Managed by: OpenHDR DirectML Engine (GitHub: scorpion421/OpenHDR-DirectML)
; ------------------------------------------------------------------------------
; Peak mastering display luminance in nits (e.g. 400 for DisplayHDR 400, 1000 for HDR1000)
display_peak_nits = 400

; Target display black level in nits
black_level_nits = 0.005

; Maximum Content Light Level (MaxCLL) and Frame-Average Light Level (MaxFALL)
max_cll = 400
max_fall = 200

; Contrast curve power (1.00 = standard linear, 1.06 = rich inky blacks)
contrast_curve = 1.06

; Adaptive color vibrance boost for midtones/highlights (0.00 = neutral, 0.35 = punchy)
; Automatically tapers to 0 in shadows to prevent chroma noise amplification.
vibrance_boost = 0.35

; Specular highlight pop intensity (0.00 = disabled, 0.20 = +20% pop up to peak nits)
specular_boost = 0.20


[Native_AMD_Hardware]
; ------------------------------------------------------------------------------
; NATIVE AMD DRIVER & HARDWARE BOUNDARY DECLARATION:
; The features listed below are handled NATIVELY by the AMD Radeon GPU,
; AMD Adrenalin Software, and Microsoft Direct3D 11 Video Processor (D3D11 VP).
;
; OpenHDR-DirectML does NOT control or modify these driver-level subsystems.
; If issues, driver crashes, or display timing anomalies occur with these
; specific features, please report them directly to AMD (via AMD Bug Report Tool)
; or to the MPC Video Renderer project, NOT to OpenHDR-DirectML.
; ------------------------------------------------------------------------------
; 1. Hardware Super Resolution (VPSuperResolution):
;    Upscaling to fullscreen display resolution (1440p, 4K UHD, Ultrawide) is
;    handled natively in hardware by the GPU and MPC Video Renderer (D3D11 VP).
;    This provides maximum fidelity with zero DirectShow RAM buffer latency
;    and rock-solid 144+ FPS presentation.
;
;    Configuration options (1 = Enabled, 0 = Disabled):
;      - MPC-BE GUI: Right-click video -> Filters -> MPC Video Renderer -> Super Resolution
;      - Windows Registry:
;          [HKCU\Software\MPC-BE Filters\MPC Video Renderer]
;          "VPSuperResolution"=dword:00000001 (or 00000000 to disable)
;      - PowerShell quick toggle:
;          Set-ItemProperty -Path "HKCU:\Software\MPC-BE Filters\MPC Video Renderer" -Name "VPSuperResolution" -Value 1
;      - AMD Adrenalin: AMD Software -> Gaming -> Graphics -> Video Super Resolution
;
; 2. AMD FreeSync Premium Pro / HDR Handshake:
;    Configured in: Windows Display Settings -> Use HDR / AMD Display Settings
; 3. D3D11 Video Processor Chroma Upsampling & Presentation:
;    Configured in: MPC Video Renderer Settings (DXGI Flip Model Swapchain)
; 4. Hardware 10-bit / 12-bit Output Scanout:
;    Configured in: AMD Adrenalin -> Gaming -> Display -> Color Depth (10 bpc)
; ------------------------------------------------------------------------------


[Performance]
; DirectML GPU device ID (0 = primary discrete GPU, e.g. AMD Radeon RX 7900 XTX)
device_id = 0

; Use FP16 half-precision tensor arithmetic for maximum performance
use_fp16 = true
